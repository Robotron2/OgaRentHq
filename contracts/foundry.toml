[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

[etherscan]
# BOT Chain Testnet (Bohr)
bot_testnet = { key = "${BOTSCAN_API_KEY}", url = "https://scan.bohr.life/api", chain = 968 }
# BOT Chain Mainnet
bot_mainnet = { key = "${BOTSCAN_API_KEY}", url = "https://scan.botchain.ai/api", chain = 677 }
